services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # host port (POSTGRES_PORT) -> Postgres' fixed in-container port 5432
      - "127.0.0.1:${POSTGRES_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # collect_energy_snapshot every INVERTER_WORKER_CRON_CYCLE_MINUTES (.env) minutes (deploy/inverter_worker/)
  inverter-worker:
    build:
      context: .
      dockerfile: deploy/inverter_worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: worker_settings
      # compose network, not the host-published localhost:POSTGRES_PORT
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
