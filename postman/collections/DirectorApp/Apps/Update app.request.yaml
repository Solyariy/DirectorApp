$kind: http-request
method: PATCH
url: '{{baseUrl}}/apps/:app_id/'
order: 4000
pathVariables:
  - key: app_id
    value: '{{appId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "description": "Updated description"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
