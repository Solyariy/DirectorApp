$kind: http-request
description: 'Only `role` (`admin` / `user`) is writable. Your own account is `409`.'
method: PATCH
url: '{{baseUrl}}/users/:user_id/'
order: 3000
pathVariables:
  - key: user_id
    value: '{{userId}}'
body:
  type: json
  content: |-
    {
      "role": "admin"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Role is admin', () => pm.expect(pm.response.json().role).to.eql('admin'));
examples: './.resources/Update user role.resources/examples'
