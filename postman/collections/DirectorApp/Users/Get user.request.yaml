$kind: http-request
method: GET
url: '{{baseUrl}}/users/:user_id/'
order: 2000
pathVariables:
  - key: user_id
    value: '{{userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
examples: './.resources/Get user.resources/examples'
