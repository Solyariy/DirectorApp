$kind: http-request
description: 'Deletes the account and its token. Your own account is `409`.'
method: DELETE
url: '{{baseUrl}}/users/:user_id/'
order: 4000
pathVariables:
  - key: user_id
    value: '{{userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
examples: './.resources/Delete user.resources/examples'
