$kind: http-example
request:
  url: '{{baseUrl}}/energy/current/'
  method: GET
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Failed to connect to inverter"
      }
order: 2000
