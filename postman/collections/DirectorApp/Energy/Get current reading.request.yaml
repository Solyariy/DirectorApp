$kind: http-request
description: 'Live read from the inverter over LAN, stored as a snapshot. 503 when the inverter is unreachable. Dashboards should prefer the newest `List snapshots` item (collected every few minutes).'
method: GET
url: '{{baseUrl}}/energy/current/'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
examples: './.resources/Get current reading.resources/examples'
