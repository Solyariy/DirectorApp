$kind: http-request
description: 'Deletes the token in `token` (all sessions of that user end) and clears the variable. Run `Obtain token` again afterwards.'
method: POST
url: '{{baseUrl}}/auth/logout/'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
      pm.collectionVariables.set('token', '');
examples: './.resources/Logout.resources/examples'
