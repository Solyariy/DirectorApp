$kind: http-example
request:
  url: '{{baseUrl}}/auth/register/'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "username": [
          "A user with that username already exists."
        ]
      }
order: 3000
