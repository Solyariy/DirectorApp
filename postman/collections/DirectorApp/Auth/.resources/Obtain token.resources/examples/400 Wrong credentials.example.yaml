$kind: http-example
request:
  url: '{{baseUrl}}/auth/token/'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "non_field_errors": [
          "Unable to log in with provided credentials."
        ]
      }
order: 2000
