  url: '{{baseUrl}}/rules/'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": [
          "rule with this name already exists."
        ]
      }
order: 4000
