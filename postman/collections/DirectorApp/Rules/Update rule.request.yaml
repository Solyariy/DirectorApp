$kind: http-request
description: 'PATCH takes any subset of `name`, `description`, `combination`, `is_active`; PUT needs `name` and `combination`.'
method: PATCH
url: '{{baseUrl}}/rules/:rule_id/'
order: 4000
pathVariables:
  - key: rule_id
    value: '{{ruleId}}'
body:
  type: json
  content: |-
    {
      "combination": {"ge": [{"field": "solar_power_w"}, 2000]}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Combination updated', () => pm.expect(pm.response.json().combination).to.eql({ge: [{field: 'solar_power_w'}, 2000]}));
