$kind: http-request
description: 'Removes the rule from every policy; the rule and the policies stay.'
method: POST
url: '{{baseUrl}}/rules/:rule_id/unlink/'
order: 5000
pathVariables:
  - key: rule_id
    value: '{{ruleId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
