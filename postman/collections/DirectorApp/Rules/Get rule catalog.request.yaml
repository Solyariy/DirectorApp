$kind: http-request
description: 'Fields a rule `combination` can read (with value type and nullability) and the operators (with the value types they accept). Use it to drive a rule builder UI.'
method: GET
url: '{{baseUrl}}/rules/catalog/'
order: 1500
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const catalog = pm.response.json();
      pm.test('Lists fields and operators', () => {
        pm.expect(catalog.fields.map((f) => f.name)).to.include('solar_power_w');
        pm.expect(catalog.operators.map((o) => o.op)).to.include('and');
      });
examples: './.resources/Get rule catalog.resources/examples'
