$kind: http-request
description: '409 while policies use the rule; run `Unlink rule` first.'
method: DELETE
url: '{{baseUrl}}/rules/:rule_id/'
order: 6000
pathVariables:
  - key: rule_id
    value: '{{ruleId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
