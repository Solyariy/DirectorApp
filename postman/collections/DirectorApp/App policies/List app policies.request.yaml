$kind: http-request
method: GET
url: '{{baseUrl}}/apps/:app_id/policies/'
order: 1000
pathVariables:
  - key: app_id
    value: '{{appId}}'
queryParams:
  - key: is_active
    value: 'true'
    description: 'Filter by is_active (any non-empty value is truthy)'
    disabled: true
  - key: effective
    value: 'true'
    description: 'Only effective connections (any non-empty value is truthy)'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
