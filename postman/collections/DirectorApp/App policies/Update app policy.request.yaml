$kind: http-request
method: PATCH
url: '{{baseUrl}}/apps/:app_id/policies/:policy_id/'
order: 3000
pathVariables:
  - key: app_id
    value: '{{appId}}'
  - key: policy_id
    value: '{{policyId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "is_active": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
