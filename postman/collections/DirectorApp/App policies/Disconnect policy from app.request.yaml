$kind: http-request
method: DELETE
url: '{{baseUrl}}/apps/:app_id/policies/:policy_id/'
order: 4000
pathVariables:
  - key: app_id
    value: '{{appId}}'
  - key: policy_id
    value: '{{policyId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
