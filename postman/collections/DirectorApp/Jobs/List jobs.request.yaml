$kind: http-request
method: GET
url: '{{baseUrl}}/jobs/'
order: 1000
queryParams:
  - key: status
    value: queued
    description: 'Filter by status: queued, in-process, success, failed (anything else is 400)'
    disabled: true
  - key: page
    value: '1'
    description: 'Page number'
    disabled: true
  - key: page_size
    value: '20'
    description: 'Page size, max 100'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is a page', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property('count');
        pm.expect(body.results).to.be.an('array');
      });
examples: './.resources/List jobs.resources/examples'
