$kind: http-request
method: PATCH
url: '{{baseUrl}}/policies/:policy_id/'
order: 5000
pathVariables:
  - key: policy_id
    value: '{{policyId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "surplus_threshold_w": 800
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
