$kind: http-request
description: '409 while the policy has active app connections.'
method: DELETE
url: '{{baseUrl}}/policies/:policy_id/'
order: 7000
pathVariables:
  - key: policy_id
    value: '{{policyId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
