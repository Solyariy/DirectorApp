openapi: 3.0.3
info:
  title: DirectorApp Jobs API
  version: 0.1.0
  description: >-
    Operator CRUD for LLM jobs (director_app). A job names an LLM `model`,
    the public `data` URLs it works on and the `prompt`; `status` starts as
    `queued`. No authentication for now; it will be redesigned later.
servers:
  - url: http://127.0.0.1:8000/api
tags:
  - name: Jobs
paths:
  /jobs/:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs
      parameters:
        - name: status
          in: query
          required: false
          description: Only jobs with this status.
          schema:
            $ref: '#/components/schemas/JobStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated jobs, ordered by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: The page does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobWrite'
            example:
              app: 4
              model: llama3.1:8b
              data:
                - https://example.com/docs/report.pdf
              prompt: Summarize the document in five bullet points.
      responses:
        '201':
          description: The created job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ValidationError'
  /jobs/{job_id}/:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get one job
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Jobs]
      operationId: replaceJob
      summary: Replace a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobWrite'
      responses:
        '200':
          description: The updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Jobs]
      operationId: updateJob
      summary: Update some fields of a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatch'
            example:
              status: in-process
      responses:
        '200':
          description: The updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Jobs]
      operationId: deleteJob
      summary: Delete a job
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: Invalid input; messages per field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotFound:
      description: The job does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Not found.
  schemas:
    JobStatus:
      type: string
      enum: [queued, in-process, success, failed]
    JobUrls:
      type: array
      description: Public http(s) URLs of the job input.
      minItems: 1
      items:
        type: string
        format: uri
        maxLength: 2048
    JobWrite:
      type: object
      required: [model, data, prompt]
      properties:
        app:
          type: integer
          nullable: true
          description: Id of the registered app that owns the job.
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: LLM model name.
        data:
          $ref: '#/components/schemas/JobUrls'
        prompt:
          type: string
          minLength: 1
        status:
          allOf:
            - $ref: '#/components/schemas/JobStatus'
          default: queued
    JobPatch:
      type: object
      description: Any subset of the writable job fields.
      properties:
        app:
          type: integer
          nullable: true
        model:
          type: string
          minLength: 1
          maxLength: 200
        data:
          $ref: '#/components/schemas/JobUrls'
        prompt:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/JobStatus'
    Job:
      type: object
      required:
        - id
        - app
        - model
        - data
        - prompt
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        app:
          type: integer
          nullable: true
          description: Becomes null when the app is deleted.
        model:
          type: string
        data:
          $ref: '#/components/schemas/JobUrls'
        prompt:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 7
        app: 4
        model: llama3.1:8b
        data:
          - https://example.com/docs/report.pdf
        prompt: Summarize the document in five bullet points.
        status: queued
        created_at: '2026-10-27T09:00:00Z'
        updated_at: '2026-10-27T09:00:00Z'
    JobPage:
      type: object
      required: [count, next, previous, results]
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    ValidationError:
      type: object
      description: >-
        Messages per field; `data` item errors are keyed by the item index.
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/Messages'
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/Messages'
      example:
        model:
          - This field is required.
        data:
          '0':
            - Enter a valid URL.
    Messages:
      type: array
      items:
        type: string
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
