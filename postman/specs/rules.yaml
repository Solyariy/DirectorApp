openapi: 3.0.3
info:
  title: DirectorApp Rules API
  version: 0.1.0
  description: >-
    Operator CRUD for rules (director_app). A rule is a condition over one
    energy reading, stored as a JSON expression tree in `combination`
    (grammar in README.md, "Rules"). Rules are linked to policies through the
    policy API (`rules` on `/policies/`). No authentication for now; it will
    be redesigned later.
servers:
  - url: http://127.0.0.1:8000/api
tags:
  - name: Rules
paths:
  /rules/:
    get:
      tags: [Rules]
      operationId: listRules
      summary: List rules
      parameters:
        - name: is_active
          in: query
          required: false
          description: Only active or inactive rules.
          schema:
            type: string
            enum: ['true', 'false', '1', '0']
        - name: search
          in: query
          required: false
          description: Case-insensitive name filter.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated rules, ordered by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: The page does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Rules]
      operationId: createRule
      summary: Create a rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleWrite'
            example:
              name: Sunny
              description: Solar output above 1.5 kW
              combination:
                ge:
                  - field: solar_power_w
                  - 1500
      responses:
        '201':
          description: The created rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/ValidationError'
  /rules/{rule_id}/:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    get:
      tags: [Rules]
      operationId: getRule
      summary: Get one rule
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Rules]
      operationId: replaceRule
      summary: Replace a rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleWrite'
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rules]
      operationId: updateRule
      summary: Update some fields of a rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePatch'
            example:
              is_active: false
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Rules]
      operationId: deleteRule
      summary: Delete a rule
      description: Refused while the rule is linked to policies.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The rule is linked to policies; unlink it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: The rule is linked to policies; unlink it first.
  /rules/{rule_id}/unlink/:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    post:
      tags: [Rules]
      operationId: unlinkRule
      summary: Remove the rule from every policy
      description: >-
        Deletes all policy links of the rule; the rule and the policies stay.
      responses:
        '204':
          description: Unlinked (also when the rule had no links).
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: Invalid input; messages per field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotFound:
      description: The rule does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Not found.
  schemas:
    Combination:
      type: object
      description: >-
        Expression tree; every operator node is a single-key object
        `{"op": [arguments]}`. Logic `and` / `or` / `not`, comparison `eq` /
        `ne` / `gt` / `ge` / `lt` / `le`, membership `in`, arithmetic `add` /
        `sub` / `mul` / `div`. Operands are `{"field": name}`, numbers, or
        strings (`HH:MM` time, ISO 8601 datetime). The root must be a
        condition.
      example:
        and:
          - in:
              - field: weekday
              - [0, 1, 2, 3, 4]
          - ge:
              - field: solar_power_w
              - 1500
    RuleWrite:
      type: object
      required: [name, combination]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique.
        description:
          type: string
          default: ''
        combination:
          $ref: '#/components/schemas/Combination'
        is_active:
          type: boolean
          default: true
    RulePatch:
      type: object
      description: Any subset of the writable rule fields.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        combination:
          $ref: '#/components/schemas/Combination'
        is_active:
          type: boolean
    Rule:
      type: object
      required:
        - id
        - name
        - description
        - combination
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        combination:
          $ref: '#/components/schemas/Combination'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        name: Sunny
        description: Solar output above 1.5 kW
        combination:
          ge:
            - field: solar_power_w
            - 1500
        is_active: true
        created_at: '2026-10-27T09:00:00Z'
        updated_at: '2026-10-27T09:00:00Z'
    RulePage:
      type: object
      required: [count, next, previous, results]
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
    ValidationError:
      type: object
      description: >-
        Messages per field; `combination` messages start with the path of the
        bad node.
      additionalProperties:
        $ref: '#/components/schemas/Messages'
      example:
        combination:
          - "and[1].ge[0].field: unknown field 'nope'"
    Messages:
      type: array
      items:
        type: string
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
